name: Migrazioni in produzione

# Applica le migrazioni di supabase/migrations al progetto Supabase di produzione
# a ogni merge su main (ADR-0010). I segreti stanno nell'environment "production",
# disponibile solo al branch main.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collega il progetto di produzione
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migrazioni in sospeso
        run: npx supabase migration list --linked
      - name: Applica le migrazioni
        run: npx supabase db push --linked
