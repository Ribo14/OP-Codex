<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <!-- iOS: icona e nome sulla schermata Home -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="OP-Codex" />
    <!-- Barra di stato "default", non black-translucent: su iOS 26 con black-translucent l'app installata
         viene calcolata più corta della barra di stato e resta una striscia vuota in fondo
         (WebKit bug 301108, RIB-39). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Colore della barra di stato: segue il tema del sistema (--background chiaro e scuro) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta
      name="description"
      content="Catalogo, collezione e deck builder per il One Piece Card Game"
    />
    <!-- Anteprima dei link (WhatsApp, Telegram…): sito statico, quindi uguale per tutte le pagine,
         compresi gli Share Link dei mazzi (RIB-26). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OP-Codex" />
    <meta property="og:title" content="OP-Codex" />
    <meta
      property="og:description"
      content="Catalogo, collezione e mazzi per il One Piece Card Game. Apri il link per vedere il mazzo condiviso."
    />
    <meta property="og:image" content="https://op-codex.netlify.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <title>OP-Codex</title>
    <!-- Tema prima del primo disegno: script esterno, la CSP non consente script inline -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
